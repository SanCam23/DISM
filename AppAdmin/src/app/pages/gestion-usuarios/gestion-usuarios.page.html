<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Gestión Usuarios</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="abrirModalCrear()">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <ion-list>
    <ion-item *ngFor="let u of usuarios">
      <ion-label>
        <h2>{{ u.Nombre }}</h2>
        <p>User: {{ u.Usuario }}</p>
      </ion-label>
      
      <ion-buttons slot="end">
        <ion-button color="warning" (click)="abrirModalEditar(u)">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-button>

        <ion-button color="danger" (click)="borrarUsuario(u.IdUsuario!)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>

  <div *ngIf="usuarios.length === 0" class="ion-text-center ion-padding">
    <p>No hay usuarios registrados.</p>
  </div>

  <ion-modal [isOpen]="isModalOpen" (didDismiss)="cerrarModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar color="secondary">
          <ion-title>{{ esEdicion ? 'Editar' : 'Nuevo' }} Usuario</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarModal()">
              <ion-icon name="close-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-item class="ion-margin-bottom">
          <ion-label position="stacked">Nombre Completo</ion-label>
          <ion-input [(ngModel)]="usuarioActual.Nombre" placeholder="Ej: Juan Pérez"></ion-input>
        </ion-item>

        <ion-item class="ion-margin-bottom">
          <ion-label position="stacked">Usuario</ion-label>
          <ion-input [(ngModel)]="usuarioActual.Usuario" placeholder="Ej: jperez"></ion-input>
        </ion-item>

        <ion-item class="ion-margin-bottom">
          <ion-label position="stacked">Clave</ion-label>
          <ion-input [(ngModel)]="usuarioActual.Clave" type="password" placeholder="****"></ion-input>
        </ion-item>

        <ion-button expand="block" (click)="guardarUsuario()" class="ion-margin-top">
          <ion-icon slot="start" name="save-outline"></ion-icon>
          Guardar
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
